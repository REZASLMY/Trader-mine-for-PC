name: Build TraderMind OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.0)'
        required: false
        default: '1.2.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: artifacts/tradermind

      - name: Install ALL workspace deps (root)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Vite (renderer)
        run: pnpm --filter @workspace/tradermind run electron:build:vite
        env:
          NODE_ENV: production

      - name: Compile Electron main (TypeScript)
        run: pnpm --filter @workspace/tradermind run electron:compile

      - name: Build Windows Installer
        run: pnpm --filter @workspace/tradermind run electron:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # بدون GH_TOKEN تا electron-builder خودش publish نکند
          # انتشار توسط softprops/action-gh-release انجام می‌شود

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Windows-Installer
          path: artifacts/tradermind/dist-electron/*.exe
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/tradermind/dist-electron/*.exe
          name: "TraderMind OS ${{ github.ref_name }}"
          body: |
            ## TraderMind OS ${{ github.ref_name }}

            ### نصب
            فایل `TraderMind-Setup-*.exe` را دانلود و اجرا کنید.

            ### تغییرات
            برای مشاهده تغییرات به [CHANGELOG.md](CHANGELOG.md) مراجعه کنید.
          draft: false
          prerelease: false

